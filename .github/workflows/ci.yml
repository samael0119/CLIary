name: CLIary
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_macos:
        description: Cross compile Intel and Apple Silicon macOS binaries
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cliary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLIARY_BUILD_MACOS: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
      CLIARY_PACKAGE: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install validation prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh fish qemu-user
      - name: Validate and cross build
        run: |
          mkdir -p .ci-reports
          /usr/bin/time -v -o .ci-reports/time.txt bash scripts/ci-build.sh
      - name: Timing report
        if: always()
        run: |
          if test -f .ci-reports/time.txt; then
            cat .ci-reports/time.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload executable artifacts
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cliary-binaries
          path: dist/cliary-*
          if-no-files-found: error
          retention-days: 3
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cliary-build-reports
          path: .ci-reports/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cliary-binaries
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cliary-build-reports
          path: reports
      - name: Publish binary-only build as prerelease
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const suffix = `${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}`;
            const files = fs.readdirSync('dist').filter(name => /^cliary-(linux|macos)-(x86_64|arm64)$/.test(name));
            if (!files.length) throw new Error('No platform binaries found');
            const { data: release } = await github.rest.repos.createRelease({
              owner, repo, tag_name: `v0.1.0-build.${suffix}`, target_commitish: context.sha,
              name: `CLIary v0.1.0 build ${suffix}`, draft: true, prerelease: true,
              make_latest: 'false', body: fs.readFileSync('reports/release-notes.md', 'utf8')
            });
            for (const name of files) {
              const data = fs.readFileSync(`dist/${name}`);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }
              });
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, make_latest: 'false'
            });
      - name: Remove downloaded artifacts
        if: always()
        run: rm -rf dist reports
