name: CLIary
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_macos:
        description: Cross compile Intel and Apple Silicon macOS binaries
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cliary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A fork's pull request must not execute code on the private VPS.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    env:
      CLIARY_BUILD_MACOS: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
      CLIARY_PACKAGE: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated 5 GiB work disk
        run: bash scripts/ci-run-limited.sh prepare
      - name: Validate and build with 500 MiB RAM and 1 GiB swap
        run: bash scripts/ci-run-limited.sh run
      - name: Resource report
        if: always()
        run: bash scripts/ci-run-limited.sh report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload executable artifacts
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cliary-binaries
          path: ${{ env.CLIARY_CI_ROOT }}/work/source/dist/cliary-*
          if-no-files-found: error
          retention-days: 3
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cliary-build-reports
          path: ${{ env.CLIARY_CI_ROOT }}/work/source/.ci-reports/
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove work disk and stop any remaining build processes
        if: always()
        run: bash scripts/ci-run-limited.sh cleanup

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cliary-binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: cliary-build-reports
          path: reports
      - name: Publish binary-only build as prerelease
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const suffix = `${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}`;
            const files = fs.readdirSync('dist').filter(name => /^cliary-(linux|macos)-(x86_64|arm64)$/.test(name));
            if (!files.length) throw new Error('No platform binaries found');
            const { data: release } = await github.rest.repos.createRelease({
              owner, repo, tag_name: `v0.1.0-build.${suffix}`, target_commitish: context.sha,
              name: `CLIary v0.1.0 build ${suffix}`, draft: true, prerelease: true,
              make_latest: 'false', body: fs.readFileSync('reports/release-notes.md', 'utf8')
            });
            for (const name of files) {
              const data = fs.readFileSync(`dist/${name}`);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }
              });
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, make_latest: 'false'
            });
      - name: Remove downloaded artifacts
        if: always()
        run: rm -rf dist reports
