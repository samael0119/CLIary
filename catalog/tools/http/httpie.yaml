id: httpie
name: httpie
executables:
- http
description:
  en: Human-friendly HTTP client.
  zh-CN: 易读易用的 HTTP 请求客户端。
categories:
- http
tags:
- interactive
- remote
- http-client
platforms:
- linux
- macos
similar:
- curl
- xh
install:
