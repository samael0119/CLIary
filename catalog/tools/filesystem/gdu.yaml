id: gdu
name: gdu
executables:
- gdu
description:
  en: Fast disk usage analyzer with terminal interface.
  zh-CN: 快速交互式磁盘空间分析工具。
categories:
- filesystem
tags:
- disk
- storage
- tui
- fast
- disk-usage
platforms:
- linux
- macos
similar:
- ncdu
- dust
keywords:
  en:
  - disk usage
  - directory size
  - folder space
  - large files
  - interactive disk analyzer
  zh-CN:
  - 磁盘空间
  - 找大文件
  - 磁盘占用
  - 目录大小
  - 文件夹
  - 占空间
  - 占地方
  - 大文件
  - 交互式
features:
  tui: true
  interactive: true
  delete_files: true
  parallel_scan: true
install:
  brew:
    package: gdu
    command: brew install gdu
homepage: https://github.com/dundee/gdu
repository: https://github.com/dundee/gdu
license: MIT
implementation_language: Go
maintenance_status: active
common_commands:
- gdu
- gdu --no-delete
