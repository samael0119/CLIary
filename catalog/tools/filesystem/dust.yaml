id: dust
name: dust
executables:
- dust
description:
  en: Visual disk usage summary for the terminal.
  zh-CN: 在终端直观展示磁盘占用。
categories:
- filesystem
tags:
- disk
- storage
- fast
- disk-usage
platforms:
- linux
- macos
similar:
- ncdu
- gdu
keywords:
  en:
  - disk usage
  - directory size
  - folder space
  - large files
  - disk summary
  zh-CN:
  - 磁盘空间
  - 找大文件
  - 磁盘占用
  - 目录大小
  - 文件夹
  - 占空间
  - 占地方
  - 大文件
  - 空间分布
install:
  brew:
    package: dust
    command: brew install dust
  cargo:
    package: du-dust
    command: cargo install du-dust
  snap:
    package: dust
    command: snap install dust
homepage: https://github.com/bootandy/dust
repository: https://github.com/bootandy/dust
license: Apache-2.0
implementation_language: Rust
maintenance_status: active
features:
  tui: false
  interactive: false
  delete_files: false
common_commands:
- dust
- dust -n 10
