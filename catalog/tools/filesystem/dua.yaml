id: dua
name: dua
executables:
- dua
description:
  en: Disk usage analyzer and management tool.
  zh-CN: 磁盘占用分析与清理工具。
categories:
- filesystem
tags:
- disk
- storage
- interactive
- disk-usage
platforms:
- linux
- macos
similar:
- ncdu
keywords:
  en:
  - disk usage
  - directory size
  - folder space
  - large files
  - interactive disk analyzer
  zh-CN:
  - 磁盘空间
  - 找大文件
  - 磁盘占用
  - 目录大小
  - 文件夹
  - 占空间
  - 占地方
  - 大文件
  - 交互式
install:
  brew:
    package: dua-cli
    command: brew install dua-cli
  cargo:
    package: dua-cli
    command: cargo install dua-cli
homepage: https://github.com/Byron/dua-cli
repository: https://github.com/Byron/dua-cli
license: MIT
implementation_language: Rust
maintenance_status: active
features:
  tui: true
  interactive: true
  delete_files: true
  parallel_scan: true
common_commands:
- dua
- dua i
